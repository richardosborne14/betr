# BETR's own web server (B3).
#
# This file is the whole of it. BETR is a folder of static files, so this is nginx doing the
# one thing nginx is for: handing over a file and adding the headers that keep the promise
# printed on the "what this is" screen.
#
# Where it runs. BETR has its own container, in its own Compose project at /opt/betr/, on its
# own port. It is NOT part of TrybeUP's stack and shares nothing with it: not a bundle, not a
# root, not a config file, not a container. TrybeUP's nginx terminates TLS for
# betr.trybeup.com and passes the request straight through to this server, and that pass-
# through is the only line about BETR anywhere in TrybeUP's config. Everything a person can
# observe about BETR — its headers, its caching, its logging — is decided here, in BETR's own
# repo, and can be changed without touching TrybeUP at all.
#
# It listens on 172.17.0.1:8080 (the Docker bridge address, see docker-compose.yml), which is
# reachable from TrybeUP's nginx and from nowhere on the internet.

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx 1.29's mime.types has no entry for .webmanifest, so without this the manifest is
    # served as application/octet-stream and the browser refuses it — which silently kills
    # "Add to Home Screen". That matters more than it sounds: an iPhone deletes a web page's
    # storage after seven days unused, and installing to the home screen is the only defence
    # v1 has (scope §4 item 6).
    types {
        application/manifest+json  webmanifest;
    }

    # ── The promise, as a server setting ──────────────────────────────────────────────────
    # The screen says: "Loading this page is the only thing any server ever sees, and we keep
    # no record of it." access_log off is that sentence. Nothing about a visit — not the time,
    # not the address, not the page — is written anywhere, so there is no record to hand over,
    # subpoena, leak or sell. error_log is left at crit so a genuinely broken server is still
    # findable; crit never records an ordinary request.
    access_log  off;
    error_log   /dev/stderr crit;

    # Don't advertise the version to anyone scanning.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    charset       utf-8;
    charset_types text/css application/javascript application/manifest+json;

    server {
        listen 80 default_server;
        server_name _;

        root  /var/www/betr;
        index index.html;

        # ── The headers that make "nothing leaves the phone" checkable ────────────────────
        # This is the meta tag in index.html served as a real header, minus the file: entries,
        # which exist only so the page works when opened straight off disk. A header is the
        # one that counts: a meta tag can be stripped by anything that rewrites HTML.
        #
        # connect-src 'none' is the important line. fetch, XHR, WebSocket, sendBeacon and
        # EventSource are all blocked outright, so if code that phones home is ever added by
        # accident it fails loudly in the console instead of quietly succeeding.
        # font-src 'none' means no web font can be loaded, by anyone, ever.
        # There is no 'unsafe-inline' for scripts because there is no inline script.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # ── Caching: revalidate everything, always ───────────────────────────────────────
        # BETR's filenames carry no content hash (app.js is always app.js), so a browser
        # holding an old app.js against a new index.html would be running a build nobody ever
        # published — and the hash printed on the "what this is" screen would be a lie. The
        # whole site is around a hundred kilobytes; a revalidation costs a 304 and nothing
        # else. Correctness over bytes.
        add_header Cache-Control "no-cache" always;

        # Nothing here is ever hidden, but a dotfile is never something a person asked for.
        location ~ /\. {
            return 404;
        }

        # There is no client-side routing and no server-side app: every URL is a file or it
        # is nothing. A missing file is a 404, never a fallback to index.html.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
