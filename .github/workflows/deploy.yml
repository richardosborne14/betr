name: Publish BETR to betr.digitalbricks.io

# B3, moved to the Digital Bricks box in B57. Every push to main that changes what a person
# would load publishes it.
#
# There is nothing to build: web/ is the site, exactly as it sits in the repo. The only
# thing that happens between the checkout and the copy is the build hash being stamped into
# index.html, so the number printed on Help is the number of the files actually served.
#
# The tests are a hard gate. They are not a formality here: loop.test.js fails the build if
# the wordmark stops being BETR or if anything a person taps goes all-lowercase, and
# menu.test.js fails it if a link appears that is not on the allow-list. A red test means a
# rule in CLAUDE.md has been broken, and no such build is ever published.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'deploy/**'
      - 'tools/build-hash.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# Two runs at once would interleave their rsyncs and could leave the site holding files from
# both. Queue them instead; never cancel one mid-copy.
concurrency:
  group: betr-publish
  cancel-in-progress: false

env:
  SITE: https://betr.digitalbricks.io

jobs:
  publish:
    name: Test, stamp the hash, publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The gate. `node --test` from the repo root, not from web/tests/ — Node 22 refuses a
      # directory there. See docs/learnings.md.
      - name: Tests (hard gate)
        run: node --test

      - name: Stamp the build hash into index.html
        id: hash
        run: |
          hash=$(node tools/build-hash.js --write)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Build hash: $hash"
          grep -q "content=\"$hash\"" web/index.html || {
            echo "::error::the hash was not stamped into index.html"; exit 1; }

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETR_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.BETR_DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # web/tests/ is deliberately not part of the hash, so serving it would make the
      # published number impossible to check by anyone who hashed the folder they were given.
      #
      # The account this logs in as owns /srv/betr/site and nothing else: no sudo, no write to
      # the Caddy config, no reach into any other site on the box. It can publish the app; it
      # cannot change how the app is served.
      - name: Publish the site
        run: |
          rsync -rlvz --delete --chmod=D755,F644 \
            --exclude='tests/' \
            --exclude='.DS_Store' \
            web/ \
            ${{ secrets.BETR_DEPLOY_USER }}@${{ secrets.BETR_DEPLOY_HOST }}:/srv/betr/site/

      # How BETR is served lives in this repo as deploy/betr.caddy, and a person with root
      # copies it to the box. This checks the copy running there is this file. A config on
      # disk is not a config running, and a config in the repo is not a config on disk
      # (docs/learnings.md): if this fails, somebody changed one and not the other.
      - name: The server is running the config in this repo
        run: |
          live=$(ssh ${{ secrets.BETR_DEPLOY_USER }}@${{ secrets.BETR_DEPLOY_HOST }} \
                   'sha256sum /etc/caddy/conf.d/betr.caddy | cut -d" " -f1')
          mine=$(sha256sum deploy/betr.caddy | cut -d' ' -f1)
          if [ "$live" != "$mine" ]; then
            echo "::error::/etc/caddy/conf.d/betr.caddy on the box is not deploy/betr.caddy. The site files were published; the server config was not, and only a person with root can copy it (then: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy)."
            exit 1
          fi
          echo "deploy/betr.caddy is the config on the box ($mine)"

      # Everything Help and scope §7 promise, checked from outside, on the real address, over
      # TLS — the way a suspicious person would check it.
      - name: Check what the server actually says
        run: |
          set -e
          headers=$(curl -sSI --max-time 20 "$SITE/")
          echo "$headers"

          fail=0
          check() {
            if printf '%s' "$headers" | grep -qi "$1"; then
              echo "  ok   $2"
            else
              echo "::error::$2 — missing"; fail=1
            fi
          }
          check "^HTTP/[0-9.]* 200"                 "the page loads"
          check "connect-src 'none'"                "CSP blocks every outbound request"
          check "font-src 'none'"                   "CSP blocks every web font"
          check "x-content-type-options: nosniff"   "nosniff"
          check "referrer-policy: no-referrer"      "no referrer"
          check "strict-transport-security"         "HTTPS only"
          check "cache-control: no-cache"           "the page is revalidated"

          if printf '%s' "$headers" | grep -qi "^set-cookie"; then
            echo "::error::the server set a cookie — it must never set one"; fail=1
          else
            echo "  ok   no cookie is set"
          fi

          if printf '%s' "$headers" | grep -qi "^server:"; then
            echo "::error::the server names itself"; fail=1
          else
            echo "  ok   the server does not name itself"
          fi

          if printf '%s' "$headers" | grep -qi "unsafe-inline"; then
            echo "::error::CSP carries 'unsafe-inline'"; fail=1
          else
            echo "  ok   no 'unsafe-inline'"
          fi

          served=$(curl -sS --max-time 20 "$SITE/" \
            | grep -o 'name="betr-build" content="[^"]*"' | sed 's/.*content="//;s/"//')
          if [ "$served" = "${{ steps.hash.outputs.hash }}" ]; then
            echo "  ok   the page prints the hash of the files it served"
          else
            echo "::error::page says '$served', published build is '${{ steps.hash.outputs.hash }}'"; fail=1
          fi

          # The manifest has to arrive as a manifest or "Add to Home Screen" quietly stops
          # working, and on an iPhone that is the only thing keeping a person's entries.
          ctype=$(curl -sSI --max-time 20 "$SITE/manifest.webmanifest" \
            | grep -i '^content-type' | tr -d '\r')
          case "$ctype" in
            *manifest+json*) echo "  ok   the manifest is served as a manifest" ;;
            *) echo "::error::manifest content-type is '$ctype'"; fail=1 ;;
          esac

          exit $fail

      - name: Say where to look
        run: echo "Published → $SITE (build ${{ steps.hash.outputs.hash }})"
