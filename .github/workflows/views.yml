name: How many times the page has been opened

# B52, moved to the Digital Bricks box in B57. The founder asked for one number and this is
# where it is read.
#
# There is nothing to install and nothing to log into: open this repo on github.com, the
# Actions tab, this workflow, "Run workflow". The numbers appear in the run's summary a few
# seconds later. It is a button, not a command.
#
# What it reads is two files on the box: /var/log/betr/people.log, every open that did not
# say it was a robot, and robots.log, the ones that did. Every line in both is the day and
# nothing else — {"ts":"2026-09-16"} — so there is nothing here that could be about a person:
# no address, no browser, no referrer, no clock time. See deploy/betr.caddy, and
# tests/deploy.test.js, which holds that server to an allow-list of what it may read at all.
#
# It only reads. Nothing here can change the count or delete a day. Days counted by the old
# server, before the move, are not in these files.

on:
  workflow_dispatch: {}

jobs:
  count:
    name: Read the tally
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETR_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.BETR_DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Count the lines
        run: |
          set -e

          # One row per day: the date, the opens that did not say they were robots, the ones
          # that did. A file that does not exist yet is a file nobody has written to yet —
          # Caddy creates each on its first line — and says so rather than printing 0.
          raw=$(ssh ${{ secrets.BETR_DEPLOY_USER }}@${{ secrets.BETR_DEPLOY_HOST }} '
            for f in people robots; do
              [ -r "/var/log/betr/$f.log" ] || { echo "MISSING $f"; continue; }
              grep -o "[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" "/var/log/betr/$f.log" | sort | uniq -c \
                | awk -v f="$f" "{print f, \$2, \$1}"
            done')

          {
            echo "# How many times the page has been opened"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if printf '%s\n' "$raw" | grep -q '^MISSING people' && printf '%s\n' "$raw" | grep -q '^MISSING robots'; then
            echo 'Nobody and nothing has opened the page on this server yet. Nothing has been lost — the files appear on the first open.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          table=$(printf '%s\n' "$raw" | awk '
            $1=="people" {p[$2]=$3; d[$2]=1}
            $1=="robots" {r[$2]=$3; d[$2]=1}
            END { for (k in d) print k, p[k]+0, p[k]+r[k] }' | sort -r)

          human=$(printf '%s\n' "$table" | awk '{s+=$2} END {print s+0}')
          total=$(printf '%s\n' "$table" | awk '{s+=$3} END {print s+0}')
          days=$(printf '%s\n' "$table" | grep -c .)
          today=$(date -u +%Y-%m-%d)
          todays=$(printf '%s\n' "$table" | awk -v d="$today" '$1==d {print $2}')

          {
            echo "## $human, once the robots are taken out"
            echo
            echo "**$total** opens in total across $days day(s); **$human** of them did not say they were a robot."
            echo
            echo "Today so far (UTC): **${todays:-0}**."
            echo
            echo '| Day | Not robots | Every open |'
            echo '| --- | ---: | ---: |'
            printf '%s\n' "$table" | head -60 | while read -r d h n; do
              echo "| $d | **$h** | $n |"
            done
            echo
            echo '### What these numbers are, and are not'
            echo
            echo '- Both count **opens of the page**, not people. One person opening it five times is five in both.'
            echo '- **"Not robots" means "did not say it was a robot."** A scraper that lies about what it is lands in that column, and most of them lie. It is a floor, not a truth.'
            echo '- Nothing is decided by anybody'"'"'s address. The server does not read one — see deploy/betr.caddy.'
            echo '- The middle column is the honest one to watch after a post. The gap between the columns is Meta and the crawlers fetching your link for a preview.'
            echo '- A returning visitor counts again; somebody using it offline, after installing it, does not count at all, so this is a floor rather than a total.'
            echo '- Anything that asks for the page counts, **including us**. Point an uptime monitor at `/app.js`, never at the page.'
            echo '- The days are UTC days. Days before the move to betr.digitalbricks.io were counted by the old server and are not here.'
            echo '- Neither number can tell anybody — us included — who, how many people, whether anyone came back, or whether they got past the first screen.'
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$table"
          echo "TOTAL $total  NOT-ROBOTS $human"
