name: How many times the page has been opened

# B52. The founder asked for one number and this is where it is read.
#
# There is nothing to install and nothing to log into: open this repo on github.com, the
# Actions tab, this workflow, "Run workflow". The numbers appear in the run's summary a few
# seconds later. It is a button, not a command.
#
# What it reads is a folder of files on the droplet: 2026-09-10.log is every open that day,
# 2026-09-10.nobots.log is the ones that did not say they were a robot. Each holds a row of
# "1"s and nothing else, so there is nothing here that could be about a person: no address —
# BETR is never told one — no browser, no referrer, no clock time. See deploy/nginx.conf, and
# tests/deploy.test.js, which holds that server to an allow-list of what it may read at all.
#
# It only reads. Nothing here can change the count or delete a day.

on:
  workflow_dispatch: {}

jobs:
  count:
    name: Read the tally
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETR_SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.BETR_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Count the marks
        run: |
          set -e

          # Two lines per day: the date, every open, and the opens that did not say they
          # were robots. Both files hold nothing but "1"s.
          raw=$(ssh ${{ secrets.BETR_SERVER_USER }}@${{ secrets.BETR_SERVER_HOST }} '
            if [ ! -d /var/log/betr ]; then echo "NODIR"; exit 0; fi
            for f in /var/log/betr/*.log; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .log)
              case "$b" in *.nobots) continue;; esac
              n=$(wc -l < "$f" | tr -d " ")
              h=0
              [ -e "/var/log/betr/$b.nobots.log" ] && h=$(wc -l < "/var/log/betr/$b.nobots.log" | tr -d " ")
              printf "%s %s %s\n" "$b" "$n" "$h"
            done')

          {
            echo "# How many times the page has been opened"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$raw" = "NODIR" ]; then
            {
              echo "**The tally folder does not exist on the server yet.**"
              echo
              echo 'That means the server is still running the config from before B52. Somebody'
              echo 'has to run `cd /opt/betr && docker compose up -d` on the droplet once — the'
              echo 'deploy account deliberately cannot restart its own container.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$raw" ]; then
            echo 'The tally is running and nobody has opened the page yet. Nothing has been lost — a day with no opens has no file.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(printf '%s\n' "$raw" | awk '{s+=$2} END {print s+0}')
          human=$(printf '%s\n' "$raw" | awk '{s+=$3} END {print s+0}')
          days=$(printf '%s\n' "$raw" | wc -l | tr -d ' ')
          today=$(date -u +%Y-%m-%d)
          todays=$(printf '%s\n' "$raw" | awk -v d="$today" '$1==d {print $3}')

          {
            echo "## $human, once the robots are taken out"
            echo
            echo "**$total** opens in total across $days day(s); **$human** of them did not say they were a robot."
            echo "Today so far: **${todays:-0}**."
            echo
            echo '| Day | Not robots | Every open |'
            echo '| --- | ---: | ---: |'
            printf '%s\n' "$raw" | sort -r | head -60 | while read -r d n h; do
              echo "| $d | **$h** | $n |"
            done
            echo
            echo '### What these numbers are, and are not'
            echo
            echo '- Both count **opens of the page**, not people. One person opening it five times is five in both.'
            echo '- **"Not robots" means "did not say it was a robot."** A scraper that lies about what it is lands in that column, and most of them lie. It is a floor, not a truth.'
            echo '- Nothing is decided by anybody'"'"'s address. BETR is never told one — see deploy/nginx.conf.'
            echo '- The middle column is the honest one to watch after a post. The gap between the columns is Meta and the crawlers fetching your link for a preview.'
            echo '- A returning visitor counts again; somebody using it offline, after installing it, does not count at all, so this is a floor rather than a total.'
            echo '- Anything that asks for the page counts, **including us**. Point an uptime monitor at `/app.js`, never at the page.'
            echo '- Neither number can tell anybody — us included — who, how many people, whether anyone came back, or whether they got past the first screen.'
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$raw" | sort -r
          echo "TOTAL $total  NOT-ROBOTS $human"
